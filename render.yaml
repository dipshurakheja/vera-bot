# Render blueprint: https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then Render -> New -> Blueprint -> pick the repo.
services:
  - type: web
    name: vera-bot
    runtime: python
    plan: free                     # free instances sleep after ~15 min idle: keep warm with an uptime pinger on /v1/healthz
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONUTF8
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: TEAM_NAME
        value: Dipshu Vera
      - key: TEAM_MEMBERS
        value: Dipshu Rakheja
      - key: CONTACT_EMAIL
        value: dipshu.rakheja.ug23@nsut.ac.in
      - key: SUBMITTED_AT
        value: "2026-09-26T00:00:00Z"
      - key: VERA_MERCHANT_COOLDOWN_MINUTES
        value: "30"
